name: medium_clone
description: A Medium-style publishing and reading app built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # Markdown
  flutter_markdown: ^0.6.18
  flutter_quill: ^8.0.0+1
  
  # Image Handling
  cached_network_image: ^3.3.1
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  flutter_image_compress: ^1.1.2
  
  # UI
  flutter_svg: ^2.0.9
  pull_to_refresh: ^2.0.0
  
  # Utils
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  timeago: ^3.6.0
  intl: ^0.18.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Haptics
  vibration: ^3.0.0
  
  # Animations
  flutter_animate: ^4.2.0
  shimmer: ^3.0.0
  
  # Highlighting
  flutter_highlight: ^0.7.0
  
  # Network
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
